services:
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orderflow_secure_password
      POSTGRES_DB: orderflow
    volumes:
      - orderflow_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderflow"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - orderflow-network

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: orderflow-backend
    restart: always
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:orderflow_secure_password@postgres:5432/orderflow
      NODE_ENV: production
      USE_PGLITE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orderflow-network

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: orderflow-frontend
    restart: always
    ports:
      - "3080:80"
    depends_on:
      - backend
    networks:
      - orderflow-network

volumes:
  orderflow_pgdata:

networks:
  orderflow-network:
    driver: bridge
